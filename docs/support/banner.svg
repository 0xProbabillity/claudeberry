<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Support ClaudeBerry with crypto: Bitcoin, Ethereum, Base, BNB Chain, Arbitrum, TON and TRON">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141413"/><stop offset="1" stop-color="#211a16"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#d97757" stop-opacity="0.30"/><stop offset="1" stop-color="#d97757" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/></pattern>
<clipPath id="card"><rect width="1280" height="360" rx="20"/></clipPath>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.h{font-size:52px;font-weight:700;fill:#ece9e4;letter-spacing:-1px}
.s{font-size:23px;fill:#8f8a83}
.p{font-size:15px;font-weight:600;fill:#e8b49c}
.bob{animation:bob 3.2s ease-in-out infinite}
.glow{transform-origin:1010px 180px;animation:pulse 4.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{transform:scale(0.92);opacity:0.75}50%{transform:scale(1.08);opacity:1}}
@media (prefers-reduced-motion:reduce){.bob,.glow{animation:none}}
</style>
<g clip-path="url(#card)">
<rect width="1280" height="360" fill="url(#bg)"/>
<rect width="1280" height="360" fill="url(#grid)"/>
<rect x="0" y="0" width="1280" height="4" fill="#d97757"/>
<circle class="glow" cx="1010" cy="180" r="200" fill="url(#glow)"/>
<text x="96" y="98" class="s" style="font-size:17px;font-weight:600;letter-spacing:2px;fill:#d97757">FREE · OPEN SOURCE · INDEPENDENT</text>
<text x="94" y="166" class="h">Support Claude<tspan fill="#d97757">Berry</tspan></text>
<text x="96" y="210" class="s">If it put a terminal back in your pocket, a tip keeps it growing.</text>
<rect x="96" y="250" width="92" height="34" rx="17" fill="#2a2522" stroke="#3b2a22"/><text x="142" y="272" text-anchor="middle" class="p">No ads</text><rect x="197.6" y="250" width="140" height="34" rx="17" fill="#2a2522" stroke="#3b2a22"/><text x="267" y="272" text-anchor="middle" class="p">No accounts</text><rect x="347.2" y="250" width="149" height="34" rx="17" fill="#2a2522" stroke="#3b2a22"/><text x="422" y="272" text-anchor="middle" class="p">No telemetry</text><rect x="506.4" y="250" width="101" height="34" rx="17" fill="#2a2522" stroke="#3b2a22"/><text x="557" y="272" text-anchor="middle" class="p">GPL-2.0</text>
